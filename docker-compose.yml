version: "3.9"

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DEMO_MODE=true
      - GCP_PROJECT_ID=project-f0fb8de7-7240-4128-965
      - GCP_REGION=asia-south1
      - CONSTITUENCY_ID=KA-BLR-NORTH-01
      - DATABASE_URL=postgresql+asyncpg://janmat_user:devpassword@db:5432/janmat
      - GCS_MEDIA_BUCKET=janmat-media-local
      - JWT_SECRET=dev-jwt-secret-local-testing-only
      - GEMINI_MODEL=gemini-2.5-flash-lite
      - PUBSUB_TOPIC_GRIEVANCE_SUBMITTED=grievance-submitted
      - PUBSUB_TOPIC_PROCESSING_COMPLETE=processing-complete
      - PUBSUB_TOPIC_PRIORITY_UPDATED=priority-updated
      - BQ_ANALYTICS_DATASET=janmat_analytics
      - BQ_INFRASTRUCTURE_DATASET=janmat_infrastructure
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── MP Dashboard (Node.js) ───────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JANMAT_API_URL=http://backend:8080
      - DEMO_MODE=true
      - SESSION_SECRET=dev-session-secret-local
      - ALLOWED_MP_EMAILS=quantumduobuilder@gmail.com,richardjoy9946@gmail.com,mp@janmat.demo
      - DEMO_USER=mp@janmat.demo
      - DEMO_PASS=JanMat@2025!
      # Google OAuth — leave blank for demo mode (login bypassed)
      - GOOGLE_CLIENT_ID=
      - GOOGLE_CLIENT_SECRET=
      - GOOGLE_CALLBACK_URL=http://localhost:3000/auth/google/callback
    depends_on:
      - backend
    restart: unless-stopped

  # ── Local PostgreSQL (mirrors Cloud SQL schema) ──────────────────────
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: janmat
      POSTGRES_USER: janmat_user
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janmat_user -d janmat"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
