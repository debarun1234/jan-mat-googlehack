<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JanMat — MP Login</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Segoe UI',system-ui,sans-serif;
      background:linear-gradient(135deg,#0d1b6e 0%,#1a237e 40%,#1565c0 100%);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
    }
    .card{
      background:#fff;border-radius:20px;padding:48px 44px;width:100%;max-width:440px;
      box-shadow:0 32px 80px rgba(0,0,0,.35);
    }
    .logo{text-align:center;margin-bottom:36px}
    .logo .emblem{font-size:3rem;margin-bottom:8px}
    .logo h1{font-size:2rem;font-weight:900;color:#1a237e;letter-spacing:-1px}
    .logo p{font-size:.82rem;color:#5c6bc0;margin-top:4px;font-weight:500}
    .btn-google{
      width:100%;padding:14px;display:flex;align-items:center;justify-content:center;gap:12px;
      border:2px solid #e0e0e0;border-radius:10px;background:#fff;cursor:pointer;
      font-size:1rem;font-weight:700;color:#212121;transition:all .2s;text-decoration:none;
      margin-top:8px;
    }
    .btn-google:hover{border-color:#4285f4;background:#f5f8ff;box-shadow:0 4px 16px rgba(66,133,244,.15)}
    .btn-google svg{width:22px;height:22px;flex-shrink:0}
    .error{
      background:#ffebee;color:#c62828;padding:12px 16px;border-radius:8px;
      font-size:.85rem;margin-bottom:20px;border-left:3px solid #c62828
    }
    .badge{
      display:inline-block;background:#e8f5e9;color:#2e7d32;
      padding:3px 10px;border-radius:12px;font-size:.72rem;font-weight:700;margin-bottom:28px
    }
    .note{
      text-align:center;margin-top:24px;font-size:.78rem;color:#90a4ae;line-height:1.5;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="emblem">⚖️</div>
    <h1>JanMat</h1>
    <p>People's Priority Engine · MP Executive Portal</p>
  </div>
  <div style="text-align:center"><span class="badge">🔐 Secure Access · Authorized MPs Only</span></div>

  <div id="error-msg" class="error" style="display:none"></div>

  <a href="/auth/google" class="btn-google">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Sign in with Google
  </a>

  <div class="note">Access is restricted to authorized Members of Parliament.</div>
</div>
<script>
  const p = new URLSearchParams(location.search);
  if (p.get('error')) {
    const el = document.getElementById('error-msg');
    const msgs = { unauthorized: 'Your account is not authorized. Contact the JanMat administrator.' };
    el.textContent = msgs[p.get('error')] || decodeURIComponent(p.get('error'));
    el.style.display = 'block';
  }
</script>
</body>
</html>
