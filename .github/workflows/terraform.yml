name: Terraform Plan / Apply

on:
  pull_request:
    branches: [master]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [master]
    paths:
      - "infra/terraform/**"
  workflow_dispatch:

env:
  TF_VERSION: "1.9.x"

jobs:
  terraform:
    name: Terraform ${{ github.event_name == 'pull_request' && 'Plan' || 'Apply' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      # ── Auth via Workload Identity (no SA key needed) ────────────
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── Write tfvars from GitHub secrets ────────────────────────
      - name: Write terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          project_id = "${{ secrets.GCP_PROJECT_ID }}"
          region = "asia-south1"
          zone = "asia-south1-a"
          environment = "poc"
          db_password = "${{ secrets.DB_PASSWORD }}"
          db_name = "janmat"
          db_user = "janmat_user"
          db_stop_schedule = "30 17 * * *"
          db_start_schedule = "30 1 * * *"
          gemini_model = "gemini-2.5-flash-lite"
          constituency_id = "KA-BLR-NORTH-01"
          EOF
          # Auto-format the generated tfvars so fmt -check passes
          terraform fmt terraform.tfvars

      - name: terraform init
        run: terraform init -upgrade

      - name: terraform fmt check
        # Check only .tf files, not the generated .tfvars
        run: terraform fmt -check -recursive -write=false $(find . -name "*.tf" | tr '\n' ' ')

      - name: terraform validate
        run: terraform validate

      # ── PLAN — runs on every PR targeting master ─────────────────
      - name: terraform plan
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        id: plan
        run: terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n...(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`hcl\n${truncated}\n\`\`\`\n*Run by @${{ github.actor }} on branch \`${{ github.head_ref }}\`*`
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # ── APPLY — runs only on direct push/merge to master ─────────
      - name: terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan
