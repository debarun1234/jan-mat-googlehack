name: Terraform Plan / Apply

# ── Trigger rules ───────────────────────────────────────────────────────
# PR  → import (once, state-aware) + plan + post comment
# Push to master (PR merge) → apply saved plan from GCS
# workflow_dispatch → manual plan or apply
on:
  pull_request:
    branches: [master]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [master]
    paths:
      - "infra/terraform/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        required: false
        type: choice
        options: [plan, apply]
        default: plan

env:
  TF_VERSION: "1.9.x"
  GCS_PLAN_BUCKET: "janmat-tfplans-${{ secrets.GCP_PROJECT_ID }}"

jobs:
  # ════════════════════════════════════════════════════════════════════
  # JOB 1: PLAN  — runs on PRs and workflow_dispatch(plan)
  # Imports existing resources, plans, posts comment, saves plan to GCS
  # ════════════════════════════════════════════════════════════════════
  plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          project_id       = "${{ secrets.GCP_PROJECT_ID }}"
          region           = "asia-south1"
          zone             = "asia-south1-a"
          environment      = "poc"
          db_password      = "${{ secrets.DB_PASSWORD }}"
          db_name          = "janmat"
          db_user          = "janmat_user"
          db_stop_schedule = "30 17 * * *"
          db_start_schedule = "30 1 * * *"
          gemini_model     = "gemini-2.5-flash-lite"
          constituency_id  = "KA-BLR-NORTH-01"
          EOF

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Save plan to GCS (PR only)
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        run: |
          gcloud storage cp tfplan \
            gs://${{ env.GCS_PLAN_BUCKET }}/pr-${{ github.event.pull_request.number }}/tfplan

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n...(truncated)' : plan;
            const outcome = '${{ steps.plan.outcome }}';
            const icon = outcome === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${icon} Terraform Plan\n\`\`\`\n${truncated}\n\`\`\`\n*Plan saved to GCS — apply runs automatically on merge to master.*`
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ════════════════════════════════════════════════════════════════════
  # JOB 2: APPLY — runs ONLY on push to master (PR merge)
  # Uses saved plan from GCS. No import, no re-plan.
  # ════════════════════════════════════════════════════════════════════
  apply:
    name: Terraform Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          project_id       = "${{ secrets.GCP_PROJECT_ID }}"
          region           = "asia-south1"
          zone             = "asia-south1-a"
          environment      = "poc"
          db_password      = "${{ secrets.DB_PASSWORD }}"
          db_name          = "janmat"
          db_user          = "janmat_user"
          db_stop_schedule = "30 17 * * *"
          db_start_schedule = "30 1 * * *"
          gemini_model     = "gemini-2.5-flash-lite"
          constituency_id  = "KA-BLR-NORTH-01"
          EOF

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Download saved plan from GCS
        id: download
        run: |
          # Find plan saved by the PR that produced this merge commit
          PR_NUMBER=$(gh pr list --state merged --base master \
            --json number,mergeCommit \
            --jq ".[] | select(.mergeCommit.oid == \"${{ github.sha }}\") | .number" \
            --repo ${{ github.repository }} 2>/dev/null || echo "")
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT

          if [ -n "$PR_NUMBER" ]; then
            echo "Attempting to download plan from PR #${PR_NUMBER}"
            if gcloud storage cp \
              gs://${{ env.GCS_PLAN_BUCKET }}/pr-${PR_NUMBER}/tfplan tfplan 2>/dev/null; then
              echo "has_saved_plan=true" >> $GITHUB_OUTPUT
            else
              echo "Saved plan not found or deleted — will run fresh plan"
              echo "has_saved_plan=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No PR found (direct push) — will run fresh plan"
            echo "has_saved_plan=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Terraform Apply (saved plan)
        id: apply_saved
        if: steps.download.outputs.has_saved_plan == 'true'
        run: terraform apply -auto-approve tfplan
        continue-on-error: true

      - name: Terraform Apply (fresh plan — saved plan stale or no PR)
        if: steps.download.outputs.has_saved_plan == 'false' || steps.apply_saved.outcome == 'failure'
        run: |
          echo "Running fresh plan (saved plan was stale or unavailable)"
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan
