name: CI - PR Checks

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - "dashboard/**"
      - "citizen-app/**"
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "dashboard/**"
      - "citizen-app/**"

jobs:
  backend:
    name: Backend - lint + test
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'backend/') ||
      github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt ruff pytest pytest-asyncio httpx

      - name: Lint
        run: ruff check app/

      - name: Format check
        run: ruff format --check app/

      - name: Tests
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          JWT_SECRET: ci-test-secret
          GEMINI_MODEL: gemini-2.5-flash-lite
          BQ_ANALYTICS_DATASET: janmat_analytics
          BQ_INFRASTRUCTURE_DATASET: janmat_infrastructure
          CONSTITUENCY_ID: KA-BLR-NORTH-01
          GCS_MEDIA_BUCKET: janmat-media-ci
          PUBSUB_TOPIC_GRIEVANCE_SUBMITTED: grievance-submitted
          PUBSUB_TOPIC_PROCESSING_COMPLETE: processing-complete
          PUBSUB_TOPIC_PRIORITY_UPDATED: priority-updated
        run: |
          if [ -d tests ]; then pytest tests/ -v --tb=short
          else echo "No tests yet - skipping"; fi

  dashboard:
    name: Dashboard - install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install deps
        run: npm ci --prefer-offline

  flutter:
    name: Flutter - analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: stable
          cache: true

      - name: Get packages
        working-directory: citizen-app
        run: flutter pub get

      - name: Analyze
        working-directory: citizen-app
        run: flutter analyze --no-fatal-infos
