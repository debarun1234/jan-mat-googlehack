name: CI PR Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  backend:
    name: Backend Â· lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff pytest pytest-asyncio httpx
      - run: ruff check app/
      - run: ruff format --check app/
      - name: Tests
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          JWT_SECRET: ci-test-secret
          GEMINI_MODEL: gemini-2.5-flash-lite
          BQ_ANALYTICS_DATASET: janmat_analytics
          BQ_INFRASTRUCTURE_DATASET: janmat_infrastructure
          CONSTITUENCY_ID: KA-BLR-NORTH-01
          GCS_MEDIA_BUCKET: janmat-media-ci
          PUBSUB_TOPIC_GRIEVANCE_SUBMITTED: grievance-submitted
          PUBSUB_TOPIC_PROCESSING_COMPLETE: processing-complete
          PUBSUB_TOPIC_PRIORITY_UPDATED: priority-updated
        run: |
          if [ -d tests ]; then pytest tests/ -v --tb=short
          else echo "No tests yet"; fi
  dashboard:
    name: Dashboard Â· install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --prefer-offline
  flutter:
    name: Flutter Â· analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: stable
          cache: true
      - working-directory: citizen-app
        run: flutter pub get
      - working-directory: citizen-app
        run: flutter analyze --no-fatal-infos
  terraform-validate:
    name: Terraform Â· validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"
      - working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - working-directory: infra/terraform
        run: terraform init -backend=false
      - working-directory: infra/terraform
        run: terraform validate