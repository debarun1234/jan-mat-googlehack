name: Deploy Backend to Cloud Run
on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "bigquery/queries/**"
  workflow_dispatch:
env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1
  SERVICE: janmat-backend
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/janmat-backend
jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build & push image
        run: |
          gcloud builds submit backend/ \
            --tag "$IMAGE:$GITHUB_SHA" \
            --project "$PROJECT_ID" \
            --timeout 900s
          gcloud container images add-tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest" --quiet
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          project_id: ${{ env.PROJECT_ID }}
          flags: --min-instances=0 --max-instances=5 --memory=512Mi --cpu=1 --timeout=300
      - name: Smoke test
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.url }}/health" --max-time 30)
          echo "Health check: HTTP $STATUS"
