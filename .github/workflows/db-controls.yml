name: Cost Guard - Morning Startup

# Startup at 6:00 AM IST (Asia/Kolkata)
# Starts Cloud SQL + verifies all Cloud Run services are live.
# Cloud Run auto-scales on first request (min-instances=0 is sufficient).
on:
  schedule:
    - cron: '0 6 * * *'
      timezone: 'Asia/Kolkata'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  DB_INSTANCE: janmat-db-poc
  REGION: asia-south1

jobs:
  morning-startup:
    name: Morning Startup (6:00 AM IST Asia/Kolkata)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Start Cloud SQL
        run: |
          STATE=$(gcloud sql instances describe $DB_INSTANCE \
            --project=$PROJECT_ID --format='value(state)' 2>/dev/null || echo "UNKNOWN")
          echo "Cloud SQL state: $STATE"
          if [ "$STATE" != "RUNNABLE" ]; then
            gcloud sql instances patch $DB_INSTANCE \
              --project=$PROJECT_ID --activation-policy=ALWAYS --quiet
            echo "Cloud SQL starting"
          else
            echo "Cloud SQL already running"
          fi

      - name: Verify Cloud Run services
        run: |
          for svc in janmat-backend janmat-dashboard janmat-etl; do
            URL=$(gcloud run services describe $svc \
              --project=$PROJECT_ID --region=$REGION \
              --format='value(status.url)' 2>/dev/null || echo "")
            if [ -n "$URL" ]; then
              echo "$svc live: $URL"
            else
              echo "$svc not found or not deployed"
            fi
          done

      - name: Confirm Cloud SQL ready
        run: |
          sleep 30
          echo "Time (IST): $(TZ='Asia/Kolkata' date)"
          STATE=$(gcloud sql instances describe $DB_INSTANCE \
            --project=$PROJECT_ID --format='value(state)' 2>/dev/null || echo "UNKNOWN")
          echo "Cloud SQL: $STATE"
          echo "System live. Cloud Run scales up on traffic."
          echo "Next shutdown: 11:00 PM IST (Asia/Kolkata)"
