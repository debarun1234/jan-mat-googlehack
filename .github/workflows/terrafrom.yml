name: Terraform — Plan / Apply
on:
  pull_request:
    branches: [main]
    paths: ["infra/terraform/**"]
  push:
    branches: [main]
    paths: ["infra/terraform/**"]
env:
  TF_VERSION: "1.9.x"
jobs:
  terraform:
    name: Terraform ${{ github.event_name == 'pull_request' && 'Plan' || 'Apply' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Write tfvars
        run: |
          cat > terraform.tfvars <<EOF
          project_id="${{ secrets.GCP_PROJECT_ID }}"
          region="asia-south1"
          zone="asia-south1-a"
          environment="poc"
          db_password="${{ secrets.DB_PASSWORD }}"
          db_name="janmat"
          db_user="janmat_user"
          db_stop_schedule="30 17 * * *"
          db_start_schedule="30 1 * * *"
          gemini_model="gemini-2.5-flash-lite"
          constituency_id="KA-BLR-NORTH-01"
          EOF
      - run: terraform init -upgrade
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
      - run: terraform fmt -check -recursive
      - name: terraform plan
        id: plan
        run: terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        continue-on-error: true
      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/plan_output.txt','utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`\n${plan.substring(0,60000)}\n\`\`\``
            });
      - if: steps.plan.outcome == 'failure'
        run: exit 1
      - name: terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}