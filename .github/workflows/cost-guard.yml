name: Cost Guard - Nightly Shutdown

# Shutdown at 11:00 PM IST (Asia/Kolkata)
# Stops Cloud SQL + scales all Cloud Run services to min-instances=0
# so no idle compute or network egress charges overnight.
on:
  schedule:
    - cron: '0 23 * * *'
      timezone: 'Asia/Kolkata'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  DB_INSTANCE: janmat-db-poc
  REGION: asia-south1

jobs:
  nightly-shutdown:
    name: Nightly Shutdown (11:00 PM IST Asia/Kolkata)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Stop Cloud SQL
        run: |
          STATE=$(gcloud sql instances describe $DB_INSTANCE \
            --project=$PROJECT_ID --format='value(state)' 2>/dev/null || echo "UNKNOWN")
          echo "Cloud SQL state: $STATE"
          if [ "$STATE" = "RUNNABLE" ]; then
            gcloud sql instances patch $DB_INSTANCE \
              --project=$PROJECT_ID --activation-policy=NEVER --quiet
            echo "Cloud SQL stopped"
          else
            echo "Cloud SQL already stopped"
          fi

      - name: Scale janmat-backend to zero
        run: |
          gcloud run services update janmat-backend \
            --project=$PROJECT_ID --region=$REGION --min-instances=0 --quiet 2>/dev/null \
            && echo "janmat-backend min-instances=0" || echo "janmat-backend not found (skip)"

      - name: Scale janmat-dashboard to zero
        run: |
          gcloud run services update janmat-dashboard \
            --project=$PROJECT_ID --region=$REGION --min-instances=0 --quiet 2>/dev/null \
            && echo "janmat-dashboard min-instances=0" || echo "janmat-dashboard not found (skip)"

      - name: Scale janmat-etl to zero
        run: |
          gcloud run services update janmat-etl \
            --project=$PROJECT_ID --region=$REGION --min-instances=0 --quiet 2>/dev/null \
            && echo "janmat-etl min-instances=0" || echo "janmat-etl not found (skip)"

      - name: Shutdown summary
        run: |
          echo "JanMat Nightly Shutdown Complete"
          echo "Time (IST): $(TZ='Asia/Kolkata' date)"
          DB_STATE=$(gcloud sql instances describe $DB_INSTANCE \
            --project=$PROJECT_ID --format='value(state)' 2>/dev/null || echo "UNKNOWN")
          echo "Cloud SQL: $DB_STATE"
          echo "All Cloud Run services: min-instances=0"
          echo "Next startup: 6:00 AM IST (Asia/Kolkata)"
