name: Cost Guard - Nightly Shutdown

on:
  schedule:
    # 17:30 UTC = 11:00 PM IST — stop everything
    - cron: "30 17 * * *"

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  DB_INSTANCE: janmat-db-poc
  CLOUD_RUN_SERVICE: janmat-backend
  REGION: asia-south1

jobs:
  nightly-shutdown:
    name: Nightly Shutdown (11:00 PM IST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # ── 1. Stop Cloud SQL ──────────────────────────────────────────────
      - name: Stop Cloud SQL
        run: |
          STATE=$(gcloud sql instances describe $DB_INSTANCE \
            --project=$PROJECT_ID --format='value(state)' 2>/dev/null || echo "UNKNOWN")
          echo "Current state: $STATE"
          if [ "$STATE" = "RUNNABLE" ]; then
            echo "Stopping Cloud SQL..."
            gcloud sql instances patch $DB_INSTANCE \
              --project=$PROJECT_ID \
              --activation-policy=NEVER \
              --quiet
            echo "✅ Cloud SQL stopped"
          else
            echo "ℹ️  Cloud SQL already stopped (state=$STATE)"
          fi

      # ── 2. Scale Cloud Run to 0 ────────────────────────────────────────
      - name: Scale Cloud Run to zero
        run: |
          gcloud run services update $CLOUD_RUN_SERVICE \
            --project=$PROJECT_ID \
            --region=$REGION \
            --min-instances=0 \
            --quiet 2>/dev/null && echo "✅ Cloud Run min-instances=0" \
            || echo "ℹ️  Cloud Run service not found or already at 0 (skip)"

      # ── 3. Summary ────────────────────────────────────────────────────
      - name: Shutdown summary
        run: |
          echo "=== Nightly Shutdown Complete ==="
          echo "Time (UTC): $(date -u)"
          echo "Time (IST): $(TZ='Asia/Kolkata' date)"
          DB_STATE=$(gcloud sql instances describe $DB_INSTANCE \
            --project=$PROJECT_ID --format='value(state)' 2>/dev/null || echo "UNKNOWN")
          echo "Cloud SQL: $DB_STATE"
          echo "Cloud Run: min-instances=0 (scales to zero on no traffic)"
          echo "Auto-restart scheduled: 6:00 AM IST (00:30 UTC)"
