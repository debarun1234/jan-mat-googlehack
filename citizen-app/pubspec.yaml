name: janmat_citizen
description: JanMat Citizen App — AI-driven constituency development platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.7.0

  # Firebase — Phone OTP authentication
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4

  # Google Maps + heatmap visualization
  google_maps_flutter: ^2.9.0

  # Audio recording + playback
  record: ^7.1.1
  path_provider: ^2.1.4
  audioplayers: ^6.1.0

  # Image picking
  image_picker: ^1.1.2

  # Location GPS
  geolocator: ^14.0.3
  permission_handler: ^12.0.3

  # State / storage
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  intl: ^0.20.3

  # In-app update
  package_info_plus: ^8.1.2
  open_file: ^3.5.9

  # UI
  cupertino_icons: ^1.0.8
  country_code_picker: ^3.0.0 # Phone country code

flutter:
  uses-material-design: true
  assets:
    - assets/
